    </linearGradient>
  </defs>
  <rect width="560" height="60" rx="14" fill="url(#tbg)" stroke="#22314f"/>
  <g font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace" font-size="20">
    <circle cx="24" cy="30" r="5" fill="#2dd4bf" opacity="0.9"/>
    <text x="42" y="37" fill="#9aa7bd">building</text>

    <g fill="#5eead4" font-weight="700">
