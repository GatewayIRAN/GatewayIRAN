      </text>
      <text x="148" y="37" opacity="0">how-tos
        <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.43;0.48;0.5;0.55;0.68;0.73;0.75;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="148" y="37" opacity="0">comparisons
