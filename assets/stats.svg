<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="136" viewBox="0 0 1180 136" role="img" aria-label="numbers: v1.0.0 release with 13 binaries, MIT license, Linux and macOS, about a thousand Telegram readers">
  <title>The collection in numbers</title>
  <defs>
    <linearGradient id="tv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="tv2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="tv3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="tv4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">

    <g>
      <rect x="0" y="8" width="283" height="120" rx="14" fill="#101a30" stroke="#22314f"/>
      <text x="24" y="46" font-size="13" font-weight="700" letter-spacing="2.4" fill="#6e7b94">LATEST RELEASE</text>
      <text x="24" y="88" font-size="34" font-weight="800" fill="url(#tv)">v1.0.0</text>
      <text x="24" y="114" font-size="14" fill="#9aa7bd">13 downloadable binaries</text>
    </g>

    <g>
      <rect x="299" y="8" width="283" height="120" rx="14" fill="#101a30" stroke="#22314f"/>
      <text x="323" y="46" font-size="13" font-weight="700" letter-spacing="2.4" fill="#6e7b94">LICENSE</text>
      <text x="323" y="88" font-size="34" font-weight="800" fill="url(#tv2)">MIT</text>
      <text x="323" y="114" font-size="14" fill="#9aa7bd">open source, zero unsafe code</text>
    </g>

    <g>
      <rect x="598" y="8" width="283" height="120" rx="14" fill="#101a30" stroke="#22314f"/>
      <text x="622" y="46" font-size="13" font-weight="700" letter-spacing="2.4" fill="#6e7b94">PLATFORMS</text>
      <text x="622" y="88" font-size="30" font-weight="800" fill="url(#tv3)">Linux · macOS</text>
      <text x="622" y="114" font-size="14" fill="#9aa7bd">one static binary, no runtime</text>
    </g>

    <g>
      <rect x="897" y="8" width="283" height="120" rx="14" fill="#101a30" stroke="#22314f"/>
      <text x="921" y="46" font-size="13" font-weight="700" letter-spacing="2.4" fill="#6e7b94">TELEGRAM</text>
      <text x="921" y="88" font-size="34" font-weight="800" fill="url(#tv4)">~1,000</text>
      <text x="921" y="114" font-size="14" fill="#9aa7bd">readers in @GatewayIRAN</text>
    </g>
  </g>
</svg>
