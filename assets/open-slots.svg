<svg xmlns="http://www.w3.org/2000/svg" width="580" height="284" viewBox="0 0 580 284" role="img" aria-label="open slots — new tools, how-tos and comparisons land here">
  <title>Open slots — the collection grows</title>
  <defs>
    <linearGradient id="opanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1729"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="oplus" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="ogrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#2b3a5c" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="580" height="284" rx="16" fill="url(#opanel)"/>
  <rect width="580" height="284" rx="16" fill="url(#ogrid)"/>
  <rect x="0.5" y="0.5" width="579" height="283" rx="15.5" fill="none" stroke="#2b3a5c" stroke-dasharray="7 7"/>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <circle cx="290" cy="78" r="27" fill="url(#oplus)" opacity="0.18"/>
    <circle cx="290" cy="78" r="27" fill="none" stroke="#a78bfa" stroke-opacity="0.7"/>
    <path d="M 290 66 v 24 M 278 78 h 24" stroke="#c4b5fd" stroke-width="3.4" stroke-linecap="round"/>

    <text x="290" y="140" font-size="26" font-weight="800" fill="#e6edf3">Open slots</text>
    <text x="290" y="170" font-size="15" fill="#9aa7bd">new tools, how-tos &amp; comparisons land here —</text>
    <text x="290" y="192" font-size="15" fill="#9aa7bd">the collection is not limited to one project</text>

    <g font-size="13" font-weight="600" fill="#7d8caa">
      <rect x="112" y="222" width="112" height="28" rx="14" fill="none" stroke="#2b3a5c" stroke-dasharray="5 5"/>
      <text x="168" y="240">tool: ___</text>
      <rect x="234" y="222" width="120" height="28" rx="14" fill="none" stroke="#2b3a5c" stroke-dasharray="5 5"/>
      <text x="294" y="240">how-to: ___</text>
      <rect x="364" y="222" width="104" height="28" rx="14" fill="none" stroke="#2b3a5c" stroke-dasharray="5 5"/>
      <text x="416" y="240">vs: ___</text>
    </g>
  </g>
</svg>
