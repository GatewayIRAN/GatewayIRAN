<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="GatewayIRAN — open source collection">
  <title>GatewayIRAN — open tools, how-tos, gateways for real boxes</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="0.55" stop-color="#0d1428"/>
      <stop offset="1" stop-color="#101c3a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gg" gradientUnits="userSpaceOnUse" x1="113" y1="31" x2="348" y2="310">
      <stop offset="0" stop-color="#4E7BFF"/>
      <stop offset="0.5" stop-color="#7DA2FF"/>
      <stop offset="1" stop-color="#BFD4FF"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#33436b" opacity="0.35"/>
    </pattern>
    <radialGradient id="markglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4E7BFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4E7BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="22" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="21.5" fill="none" stroke="#22314f"/>

  <!-- ===== the GatewayIRAN mark: G + server stack in the flag colours ===== -->
  <g>
    <ellipse cx="950" cy="210" rx="190" ry="185" fill="url(#markglow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite"/>
    </ellipse>
    <g transform="translate(950 210) scale(0.86) translate(-204 -170)">
      <path fill="url(#gg)" d="M159 31 H302 A68 68 0 0 1 369.86 95 H170 A16 16 0 0 0 154 111 V231 A16 16 0 0 0 170 247 H290 A16 16 0 0 0 306 231 V197 H243 A16 26.5 0 0 1 243 144 H370 V242 A68 68 0 0 1 302 310 H159 A68 68 0 0 1 91 242 V99 A68 68 0 0 1 159 31 Z"/>
      <rect x="50" y="202" width="80" height="24" rx="12" fill="#17A34A" stroke="#0B1030" stroke-width="4.5"/>
      <circle cx="68" cy="214" r="4.2" fill="#FFFFFF"/>
      <circle cx="86" cy="214" r="4.2" fill="#FFFFFF"/>
      <rect x="50" y="235" width="80" height="24" rx="12" fill="#FFFFFF" stroke="#0B1030" stroke-width="4.5"/>
      <circle cx="68" cy="247" r="4.2" fill="#0B1030"/>
      <circle cx="86" cy="247" r="4.2" fill="#0B1030"/>
      <rect x="50" y="269" width="80" height="24" rx="12" fill="#E11B2C" stroke="#0B1030" stroke-width="4.5"/>
      <circle cx="68" cy="281" r="4.2" fill="#FFFFFF"/>
      <circle cx="86" cy="281" r="4.2" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- ===== title block ===== -->
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="80" y="120" font-size="15" font-weight="600" letter-spacing="6" fill="#5eead4">OPEN SOURCE COLLECTION</text>
    <text x="80" y="198" font-size="66" font-weight="800" fill="url(#title)">GatewayIRAN</text>
    <rect x="80" y="216" width="148" height="5" rx="2.5" fill="url(#bar)"/>
    <text x="80" y="260" font-size="25" fill="#9aa7bd">Open tools · how-tos · gateways for real boxes</text>

    <g font-size="15" font-weight="600" fill="#cdd9ec" text-anchor="middle" id="banner-facts"><!--facts-start-->
      <rect x="80" y="292" width="214" height="36" rx="18" fill="#13203a" stroke="#27406b"/>
      <text x="187" y="315">3 public repositories</text>
      <rect x="306" y="292" width="206" height="36" rx="18" fill="#13203a" stroke="#27406b"/>
      <text x="409" y="315">3 active this period</text>
      <rect x="524" y="292" width="197" height="36" rx="18" fill="#13203a" stroke="#27406b"/>
      <text x="622" y="315">2 stars on the list</text>
      <rect x="733" y="292" width="128" height="36" rx="18" fill="#13203a" stroke="#27406b"/>
      <text x="797" y="315">open source</text>
      <!--facts-end-->
    </g>
  </g>
</svg>
