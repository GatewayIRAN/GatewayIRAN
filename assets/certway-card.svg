<svg xmlns="http://www.w3.org/2000/svg" width="580" height="284" viewBox="0 0 580 284" role="img" aria-label="certway — HTTPS in one command">
  <title>certway — HTTPS in one command</title>
  <defs>
    <linearGradient id="cpanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a30"/>
      <stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="cmark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="580" height="284" rx="16" fill="url(#cpanel)"/>
  <rect x="0.5" y="0.5" width="579" height="283" rx="15.5" fill="none" stroke="#22314f"/>
  <rect x="24" y="24" width="4" height="236" rx="2" fill="url(#cedge)"/>

  <!-- mark: certificate + gate -->
  <g transform="translate(44 34)">
    <rect width="52" height="52" rx="14" fill="url(#cmark)" opacity="0.16"/>
    <rect x="0.5" y="0.5" width="51" height="51" rx="13.5" fill="none" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <path d="M 17 40 V 24 Q 26 14 35 24 V 40" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>
    <path d="M 26 33 v 7 m 0 0 a 4 4 0 1 0 0.01 0" fill="none" stroke="#a78bfa" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="112" y="62" font-size="30" font-weight="800" fill="#e6edf3">certway</text>
    <rect x="238" y="42" width="86" height="26" rx="13" fill="#3a2d13" stroke="#7c5a12"/>
    <text x="281" y="60" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">flagship</text>
    <text x="112" y="88" font-size="15" fill="#9aa7bd">HTTPS in one command — one static binary, no runtime</text>

    <g font-size="15" fill="#cdd9ec">
      <circle cx="52" cy="126" r="3.2" fill="#2dd4bf"/>
      <text x="66" y="131">Let's Encrypt or any ACME server</text>
      <circle cx="52" cy="158" r="3.2" fill="#2dd4bf"/>
      <text x="66" y="163">HTTP-01 &amp; DNS-01 — nginx or by hand</text>
      <circle cx="52" cy="190" r="3.2" fill="#2dd4bf"/>
      <text x="66" y="195">renewal on a systemd timer, or cron</text>
      <circle cx="52" cy="222" r="3.2" fill="#2dd4bf"/>
      <text x="66" y="227">ECDSA P-256, zero unsafe code</text>
    </g>

    <g font-size="13" font-weight="600" fill="#9fb2cf" text-anchor="middle">
      <rect x="44" y="246" width="70" height="26" rx="13" fill="#13203a" stroke="#27406b"/>
      <text x="79" y="263">Rust</text>
      <rect x="122" y="246" width="64" height="26" rx="13" fill="#13203a" stroke="#27406b"/>
      <text x="154" y="263">MIT</text>
      <rect x="194" y="246" width="80" height="26" rx="13" fill="#13203a" stroke="#27406b"/>
      <text x="234" y="263">v1.0.0</text>
      <rect x="282" y="246" width="106" height="26" rx="13" fill="#13203a" stroke="#27406b"/>
      <text x="335" y="263">13 binaries</text>
    </g>
  </g>
</svg>
