<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="196" viewBox="0 0 1180 196" role="img" aria-label="join the GatewayIRAN Telegram channel — releases, how-tos and comparisons">
  <title>به کانال تلگرام GatewayIRAN بپیوندید</title>
  <defs>
    <linearGradient id="ctabg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141033"/>
      <stop offset="0.55" stop-color="#101a35"/>
      <stop offset="1" stop-color="#0d2328"/>
    </linearGradient>
    <linearGradient id="ctagate" x1="0" y1="0" x2="0" y2="1">
