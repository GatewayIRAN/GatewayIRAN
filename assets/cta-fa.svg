  </g>

  <g font-family="Vazirmatn, ui-sans-serif, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif" text-anchor="start" direction="rtl">
    <text x="1044" y="84" font-size="36" font-weight="800" fill="#e6edf3">به کانال تلگرام GatewayIRAN بپیوندید</text>
